[project]
name = "safevoice-mcp"
version = "0.1.0"
description = "MCP server for victim-of-digital-harassment tooling: classify, detect patterns, map applicable §, check Strafantrag-Fristen, determine jurisdiction, anonymisation flag. DE/AT/CH/UK."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mikel" }]
license = { text = "MIT" }

dependencies = [
    "mcp>=1.0.0",
    # The MCP wrapper imports from the SafeVoice backend (../backend/app/services/).
    # These deps mirror what backend/requirements.txt pins for those service modules.
    "pydantic>=2.0",
    "openai>=1.0",
]

[project.scripts]
safevoice-mcp = "safevoice_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["safevoice_mcp*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
