name: agent-security-boundary

on:
  pull_request:
    paths:
      - 'backend/app/services/agent_loop.py'
      - 'backend/app/services/court_prep_agent.py'
      - 'backend/app/services/court_prep_security.py'
      - 'backend/app/services/court_prep_tools.py'
      - 'backend/app/services/evidence.py'
      - 'backend/tests/test_agent_security_boundary.py'
      - '.github/workflows/agent-security-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'backend/app/services/agent_loop.py'
      - 'backend/app/services/court_prep_agent.py'
      - 'backend/app/services/court_prep_security.py'
      - 'backend/app/services/court_prep_tools.py'
      - 'backend/app/services/evidence.py'
      - 'backend/tests/test_agent_security_boundary.py'
      - '.github/workflows/agent-security-boundary.yml'

permissions:
  contents: read

jobs:
  compromised-model-containment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Prove case and network targets stay outside model authority
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_agent_security_boundary.py
